<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kutubxona</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-700">

  <!-- Header -->
  <header class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-center py-10 shadow-lg rounded-b-3xl animate__animated animate__fadeInDown">
    <h1 class="text-4xl font-bold drop-shadow-lg">📚 Kutubxonaga Xush kelibsiz</h1>
    <p class="mt-2 opacity-90">Sizga kitobni tavsiya qilamiz!</p>
    <div class="flex justify-center gap-2 mt-4 flex-wrap">
      <input id="searchInput" type="text" placeholder="Qaysi kitobni qidiryapsiz?"
        class="px-4 py-2 rounded-full w-72 max-w-full text-gray-800 focus:ring-2 focus:ring-yellow-400 outline-none shadow-md transition" />
      <button id="toggleTheme" class="px-4 py-2 rounded-full bg-white/20 hover:bg-white/30 transition shadow-md">🌙</button>
    </div>
  </header>

  <!-- Kategoriyalar -->
  <nav id="categories" class="flex flex-wrap justify-center gap-3 py-6 animate__animated animate__fadeInUp">
    <button class="category-btn" data-category="Қуръони Карим">📘 Қуръони Карим</button>
    <button class="category-btn" data-category="Тафсир китоблар">📖 Тафсир китоблар</button>
    <button class="category-btn" data-category="Ҳадис китоблар">📜 Ҳадис китоблар</button>
    <button class="category-btn" data-category="Фиқҳий китоблар">⚖️ Фиқҳий китоблар</button>
    <button class="category-btn" data-category="Ақида китоблари">🧠 Ақида китоблари</button>
    <button class="category-btn" data-category="Тарих китоблари">🏛️ Тарих китоблари</button>
    <button class="category-btn" data-category="Сийрат китоблари">👣 Сийрат китоблари</button>
    <button class="category-btn" data-category="Саҳобалар ҳаёти">👤 Саҳобалар ҳаёти</button>
    <button class="category-btn" data-category="Ахлоқ ва тарбия">🌱 Ахлоq va tarbiya</button>
    <button class="category-btn" data-category="Дуо ва зикрлар">🙏 Дуо ва зикrlar</button>
    <button class="category-btn" data-category="Ҳизб китоблари">📒 Ҳизб китоблари</button>
  </nav>

  <!-- Kitoblar joyi -->
  <main>
    <div id="booksContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 p-6 max-w-6xl mx-auto animate__animated animate__fadeInUp"></div>
  </main>

  <!-- Admin rejim tugmasi -->
  <div class="flex justify-center mt-6">
    <button id="showUploadBtn" class="btn-primary">🔑 Admin Rejim</button>
  </div>

  <!-- Upload bo‘limi -->
  <section id="uploadSection" hidden class="max-w-2xl mx-auto bg-white dark:bg-gray-800 shadow-lg rounded-2xl p-6 mt-8 animate__animated animate__fadeInUp">
    <h2 class="text-xl font-bold mb-4">📥 Yangi kitob qo‘shish</h2>
    <form id="uploadForm" class="space-y-3">
      <input type="text" id="bookTitle" placeholder="Kitob nomi" required class="form-input"/>
      <input type="text" id="bookDescription" placeholder="Tavsif" required class="form-input"/>
      <select id="bookCategory" required class="form-input">
        <option value="">Kategoriya tanlang</option>
        <option value="Қуръони Карим">Қуръони Карим</option>
        <option value="Тафсир китоблар">Тафсир китобlar</option>
        <option value="Ҳадис китоблар">Ҳадис китобlar</option>
        <option value="Фиқҳий китоблар">Фиқҳий китобlar</option>
        <option value="Ақида китоблари">Ақида китоблари</option>
        <option value="Тарих китоблари">Тарих китобlari</option>
        <option value="Сийрат китоблари">Сийрат китобlari</option>
        <option value="Саҳобалар ҳаёти">Саҳобалар ҳаёти</option>
        <option value="Ахлоқ ва тарбия">Ахлоқ va tarbiya</option>
        <option value="Дуо ва зикрлар">Дуо va зикрlar</option>
        <option value="Ҳизб китоблари">Ҳизб китоблари</option>
      </select>
      <input type="file" id="bookFile" accept="application/pdf" required class="form-input"/>
      <button type="submit" class="btn-primary w-full">Qo‘shish</button>
      <div id="progressContainer" hidden class="progress">
        <div id="progressBar" class="progress-bar">0%</div>
      </div>
    </form>
  </section>

  <!-- PDF variantlari -->
  <section id="pdfOptions" hidden class="max-w-md mx-auto bg-white dark:bg-gray-800 p-6 rounded-xl shadow-lg mt-6 text-center animate__animated animate__fadeInUp">
    <h3 class="text-lg font-semibold mb-3">📚 PDF bilan nima qilmoqchisiz?</h3>
    <button id="openPDFBtn" class="btn-primary">📖 Brauzerda ochish</button>
    <button id="downloadPDFBtn" class="btn-danger">⬇️ Yuklab olish</button>
    <div id="downloadMessage" hidden class="mt-3">
      <p class="text-green-600 font-semibold">✅ PDF muvaffaqiyatli yuklandi!</p>
      <a id="openDownloaded" href="" target="_blank" class="btn-primary mt-2 inline-block">📂 Yuklangan PDF ni ochish</a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-center py-4 mt-10 rounded-t-2xl shadow-inner animate__animated animate__fadeInUp">
    <p>&copy; 2025 Kutubxona</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>

      apiKey: "AIzaSyDuk-PhyFg5j7JkVnvfcYfBKGMoNZtT02s",
      authDomain: "kutubxona-79dd3.firebaseapp.com",
      projectId: "kutubxona-79dd3",
      storageBucket: "kutubxona-79dd3.firebasestorage.app",
      messagingSenderId: "593289819612",
      appId: "1:593289819612:web:89b9a8dd933f945eb78b19",
      measurementId: "G-Z0Z4FWPWP8"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <script src="script.js"></script>
</body>
</html>
