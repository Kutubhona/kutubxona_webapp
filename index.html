<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kutubxona — Professional</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

</head>
<body class="min-h-screen bg-surface text-ink transition-colors duration-700 antialiased dark:bg-surface-dark dark:text-ink-dark">

  <!-- Splash Screen -->
  <div id="introScreen" class="intro-screen" aria-hidden="true">
    <h1 class="intro-title">📚 Kutubxonaga</h1>
    <h2 class="intro-subtitle">Xush Kelibsiz</h2>
  </div>

  <!-- Hero Header -->
  <header class="hero reveal">
    <div class="hero__glow"></div>
    <h1 class="hero__title">📚 Kutubxonaga Xush Kelibsiz</h1>
    <p class="hero__subtitle">Sizga kitobni tavsiya qilamiz!</p>

    <div class="hero__actions">
      <div class="field">
        <input id="searchInput" type="text" class="field__input" placeholder="Qaysi kitobni qidiryapsiz?" aria-label="Kitob qidirish">
        <span class="field__icon" aria-hidden="true">🔎</span>
      </div>
      <button id="toggleTheme" class="btn btn--ghost ripple" aria-label="Mavzuni almashtirish">🌙 Qorongʻu</button>
    </div>
  </header>

  <!-- Kategoriyalar -->
  <nav id="categories" class="cats reveal" aria-label="Kitob kategoriyalari">
    <button class="cat-btn ripple" data-category="Қуръони Карим" aria-pressed="false">📘 Қуръони Карим</button>
    <button class="cat-btn ripple" data-category="Тафсир китоблар" aria-pressed="false">📖 Тафсир китоблар</button>
    <button class="cat-btn ripple" data-category="Ҳадис китоблар" aria-pressed="false">📜 Ҳадис китоблар</button>
    <button class="cat-btn ripple" data-category="Фиқҳий китоблар" aria-pressed="false">⚖️ Фиқҳий китоблар</button>
    <button class="cat-btn ripple" data-category="Ақида китоблари" aria-pressed="false">🧠 Ақида китоблари</button>
    <button class="cat-btn ripple" data-category="Тарих китоблари" aria-pressed="false">🏛️ Тарих китоблари</button>
    <button class="cat-btn ripple" data-category="Сийрат китоблари" aria-pressed="false">👣 Сийрат китоблари</button>
    <button class="cat-btn ripple" data-category="Саҳобалар ҳаёти" aria-pressed="false">👤 Саҳобалар ҳаёти</button>
    <button class="cat-btn ripple" data-category="Ҳизб китоблари" aria-pressed="false">📒 Ҳизб китоблари</button>
    <button class="cat-btn ripple" data-category="Ахлоқ ва тарбия" aria-pressed="false">🌱 Ахлоқ ва тарбия</button>
    <button class="cat-btn ripple" data-category="Дуо ва зикрлар" aria-pressed="false">🙏 Дуо ва зикрлар</button>
  </nav>

  <!-- Kitoblar -->
  <main class="container reveal">
    <div id="booksContainer" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6" aria-live="polite"></div>
    <p id="emptyState" class="empty hidden">Hozircha bu yerda kitoblar yo‘q…</p>
  </main>

  <!-- Admin Rejim -->
  <div class="center reveal">
    <button id="showUploadBtn" class="btn btn--primary ripple">🔑 Admin Rejim</button>
  </div>

  <!-- Upload bo‘limi -->
  <section id="uploadSection" hidden class="panel reveal" aria-label="Yangi kitob qo‘shish bo‘limi">
    <h2 class="panel__title">📥 Yangi kitob qo‘shish</h2>
    <form id="uploadForm" class="form">
      <div class="field">
        <input id="bookTitle" type="text" required class="field__input" placeholder="Kitob nomi">
        <label class="field__label" for="bookTitle">Kitob nomi</label>
      </div>

      <div class="field">
        <input id="bookDescription" type="text" required class="field__input" placeholder="Tavsif">
        <label class="field__label" for="bookDescription">Tavsif</label>
      </div>

      <div class="field">
        <select id="bookCategory" required class="field__input">
          <option value="">Kategoriya tanlang</option>
          <option value="Қуръони Карим">Қуръони Карим</option>
          <option value="Тафсир китоблар">Тафсир китоблар</option>
          <option value="Ҳадис китоблар">Ҳадис китоблар</option>
          <option value="Фиқҳий китоблар">Фиқҳий китоблар</option>
          <option value="Ақида китоблари">Ақида китоблари</option>
          <option value="Тарих китоблари">Тарих китоблари</option>
          <option value="Сийрат китоблари">Сийрат китоблари</option>
          <option value="Саҳобалар ҳаёти">Саҳобалар ҳаёти</option>
          <option value="Ҳизб китоблари">Ҳизб китоблари</option>
          <option value="Ахлоқ ва тарбия">Ахлоқ ва тарбия</option>
          <option value="Дуо ва зикрлар">Дуо ва зикрлар</option>
        </select>
        <label class="field__label" for="bookCategory">Kategoriya</label>
      </div>

      <div class="field">
        <input id="bookFile" type="file" accept="application/pdf" required class="field__input">
        <label class="field__label" for="bookFile">PDF fayl</label>
      </div>

      <button type="submit" class="btn btn--primary btn--block ripple">➕ Qo‘shish</button>

      <div id="progressContainer" hidden class="progress">
        <div id="progressBar" class="progress__bar">0%</div>
      </div>
    </form>
  </section>

  <!-- PDF variantlari -->
  <section id="pdfOptions" hidden class="panel panel--soft reveal">
    <h3 class="panel__title">📚 PDF bilan nima qilmoqchisiz?</h3>
    <div class="panel__actions">
      <button id="openPDFBtn" class="btn btn--ghost ripple">📖 Brauzerda ochish</button>
      <button id="downloadPDFBtn" class="btn btn--danger ripple">⬇️ Yuklab olish</button>
    </div>

    <div id="downloadMessage" hidden class="success">
      <p>✅ PDF qurilmangizga muvaffaqiyatli yuklandi!</p>
      <a id="openDownloaded" href="" target="_blank" class="btn btn--primary ripple">📂 Yuklangan PDF ni ochish</a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer reveal">
    <p>&copy; 2025 Kutubxona</p>
  </footer>

  <!-- Firebase SDK -->
  <script type="module" src="firebase-init.js"></script>

  <!-- Custom JS -->
  <script type="module" src="script.js"></script>

</body>
</html>
