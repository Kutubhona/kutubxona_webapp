<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Premium Кутубхона</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <meta name="color-scheme" content="light dark">
</head>
<body class="light">
  <!-- Splash -->
  <div id="splash" aria-hidden="true">
    <h1 data-cyrl="Кутубхонага" data-latn="Kutubxonaga">Кутубхонага</h1>
    <p data-cyrl="Хуш келибсиз!" data-latn="Xush kelibsiz!">Хуш келибсиз!</p>
  </div>

  <header>
    <h1 id="welcomeTitle"
        data-cyrl="Кутубхонага хуш келибсиз!"
        data-latn="Kutubxonaga xush kelibsiz!">Кутубхонага хуш келибсиз!</h1>
    <p class="subtitle"
       data-cyrl="Сизга китоб тавсия қиламиз!"
       data-latn="Sizga kitob tavsiya qilamiz!">Сизга китоб тавсия қиламиз!</p>

    <div class="header-actions">
      <input type="text" id="searchInput"
             placeholder="Қайси китобни қидиряпсиз?"
             aria-label="Китоб қидириш"
             data-ph-cyrl="Қайси китобни қидиряпсиз?"
             data-ph-latn="Qaysi kitobni qidiryapsiz?" />

      <button id="toggleTheme" class="btn btn-ghost" aria-label="Қоронғу/Ёруғ режим">
        <i class="fas fa-moon"></i> Қоронғу режим
      </button>

      <button id="toggleLang" class="btn btn-ghost" aria-label="Тилни алмаштириш"
              data-cyrl="Тил: Кирилл" data-latn="Til: Lotin">
        <i class="fas fa-language"></i> Тил: Кирилл
      </button>
    </div>
  </header>

  <!-- Kategoriyalar -->
  <nav class="categories-row" id="categories">
    <button class="category-btn btn" data-category="Қуръони Карим">Қуръони Карим</button>
    <button class="category-btn btn" data-category="Тафсир китоблари">Тафсир китоблари</button>
    <button class="category-btn btn" data-category="Ҳадис китоблари">Ҳадис китоблари</button>
    <button class="category-btn btn" data-category="Фиқҳий китоблар">Фиқҳий китоблар</button>
    <button class="category-btn btn" data-category="Ақида китоблари">Ақида китоблари</button>
    <button class="category-btn btn" data-category="Тарих китоблари">Тарих китоблари</button>
    <button class="category-btn btn" data-category="Сийрат китоблари">Сийрат китоблари</button>
    <button class="category-btn btn" data-category="Саҳобалар ҳаёти">Саҳобалар ҳаёти</button>
    <button class="category-btn btn" data-category="Ахлоқ ва тарбия">Ахлоқ ва тарбия</button>
    <button class="category-btn btn" data-category="Дуо ва зикрлар">Дуо ва зикрлар</button>
    <!-- yangi 2ta -->
    <button class="category-btn btn" data-category="Ал-Ваъй журнали">Ал-Ваъй журнали</button>
    <button class="category-btn btn" data-category="Ҳизб китоблари">Ҳизб китоблари</button>
  </nav>

  <main>
    <div id="booksContainer" class="grid">
      <!-- Kartalar JS orqali keladi. Matnlar til tugmasi bosilganda translit qilinadi. -->
    </div>
  </main>

  <div class="center">
    <!-- Admin Rejim matni o‘zgarmaydi. maxsus klass: no-translate -->
    <button id="adminToggle" class="btn btn-primary no-translate"><i class="fas fa-key"></i> Admin Rejim</button>
  </div>

  <!-- Modal (PDF) -->
  <div id="pdfModal" class="modal" hidden>
    <div class="modal-content">
      <span class="modal-close" title="Ёпиш">&times;</span>
      <h3 data-cyrl="PDF билан нима қилмоқчисиз?" data-latn="PDF bilan nima qilmoqchisiz?">
        <i class="fas fa-file-pdf"></i> PDF билан нима қилмоқчисиз?
      </h3>
      <button id="openPDFBtn" class="btn btn-ghost"
              data-cyrl="Браузерда очиш" data-latn="Brauzerda ochish">
        <i class="fas fa-eye"></i> Браузерда очиш
      </button>
      <button id="downloadPDFBtn" class="btn btn-danger"
              data-cyrl="Юклаб олиш" data-latn="Yuklab olish">
        <i class="fas fa-download"></i> Юклаб олиш
      </button>
      <div id="downloadNotice" hidden>
        <p class="success-text"
           data-cyrl="PDF қурилмангизга муваффақиятли юкланди!"
           data-latn="PDF qurilmangizga muvaffaqiyatli yuklandi!">
           <i class="fas fa-check-circle"></i> PDF қурилмангизга муваффақиятли юкланди!</p>
        <a id="openDownloaded" href="" target="_blank" class="btn btn-primary"
           data-cyrl="Юкланган PDF ни очиш" data-latn="Yuklangan PDF ni ochish">
           <i class="fas fa-external-link-alt"></i> Юкланган PDF ни очиш</a>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Premium Кутубхона.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
