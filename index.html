<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Кутубхона</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="light">
  <!-- Splash Screen -->
  <div id="splash">
    <h1 id="splashTitle" data-cyrl="Кутубхонага" data-latn="Kutubxonaga">Кутубхонага</h1>
    <p id="splashSubtitle" data-cyrl="Хуш келибсиз!" data-latn="Xush kelibsiz!">Хуш келибсиз!</p>
  </div>

  <header>
    <h1 id="welcomeTitle"
        data-cyrl="Кутубхонага хуш келибсиз!"
        data-latn="Kutubxonaga xush kelibsiz!">Кутубхонага хуш келибсиз!</h1>
    <p class="subtitle"
       id="welcomeSubtitle"
       data-cyrl="Сизга китоб тавсия қиламиз!"
       data-latn="Sizga kitob tavsiya qilamiz!">Сизга китоб тавсия қиламиз!</p>
    <div class="header-actions">
      <input
        type="text"
        id="searchInput"
        placeholder="Қайси китобни қидиряпсиз?"
        aria-label="Китоб қидириш"
        data-ph-cyrl="Қайси китобни қидиряпсиз?"
        data-ph-latn="Qaysi kitobni qidiryapsiz?"
      />
      <button id="toggleTheme" class="btn btn-ghost" aria-label="Мавзуни алмаштириш">
        <i class="fas fa-moon"></i> Қоронғу режим
      </button>
      <button id="toggleLang" class="btn btn-ghost" aria-label="Тилни алмаштириш"
              data-cyrl="Тил: Кирилл" data-latn="Til: Lotin">
        <i class="fas fa-language"></i> Тил: Кирилл
      </button>
    </div>
  </header>

  <nav class="categories-row">
    <button class="category-btn btn" data-category="Қуръони Карим">Қуръони Карим</button>
    <button class="category-btn btn" data-category="Тафсир китоблари">Тафсир китоблари</button>
    <button class="category-btn btn" data-category="Ҳадис китоблари">Ҳадис китоблари</button>
    <button class="category-btn btn" data-category="Фиқҳий китоблар">Фиқҳий китоблар</button>
    <button class="category-btn btn" data-category="Ақида китоблари">Ақида китоблари</button>
    <button class="category-btn btn" data-category="Тарих китоблари">Тарих китоблари</button>
    <button class="category-btn btn" data-category="Сийрат китоблари">Сийрат китоблари</button>
    <button class="category-btn btn" data-category="Саҳобалар ҳаёти">Саҳобалар ҳаёти</button>
    <button class="category-btn btn" data-category="Ахлоқ ва тарбия">Ахлоқ ва тарбия</button>
    <button class="category-btn btn" data-category="Дуо ва зикрлар">Дуо ва зикрлар</button>
    <!-- yangi ikkita -->
    <button class="category-btn btn" data-category="Ал-Ваъй журнали">Ал-Ваъй журнали</button>
    <button class="category-btn btn" data-category="Ҳизб китоблари">Ҳизб китоблари</button>
  </nav>

  <main>
    <div id="booksContainer" class="grid"></div>
  </main>

  <div class="center">
    <!-- Admin Rejim lotincha қолди (сизнинг талабингизга кўра) -->
    <button id="adminToggle" class="btn btn-primary"><i class="fas fa-key"></i> Admin Rejim</button>
  </div>

  <section id="uploadSection" hidden>
    <h2 id="uploadTitle"
        data-cyrl="Янги китоб қўшиш"
        data-latn="Yangi kitob qo'shish"><i class="fas fa-plus-circle"></i> Янги китоб қўшиш</h2>
    <form id="uploadForm">
      <input type="text" id="bookTitle"
             placeholder="Китоб номи"
             required
             data-ph-cyrl="Китоб номи"
             data-ph-latn="Kitob nomi" />
      <input type="text" id="bookDescription"
             placeholder="Тавсиф"
             required
             data-ph-cyrl="Тавсиф"
             data-ph-latn="Tavsif" />
      <select id="bookCategory" required>
        <option value=""><?/* placeholder */?></option>
        <option value="Қуръони Карим">Қуръони Карим</option>
        <option value="Тафсир китоблари">Тафсир китоблари</option>
        <option value="Ҳадис китоблари">Ҳадис китоблари</option>
        <option value="Фиқҳий китоблар">Фиқҳий китоблар</option>
        <option value="Ақида китоблари">Ақида китоблари</option>
        <option value="Тарих китоблари">Тарих китоблари</option>
        <option value="Сийрат китоблари">Сийрат китоблари</option>
        <option value="Саҳобалар ҳаёти">Саҳобалар ҳаёти</option>
        <option value="Ахлоқ ва тарбия">Ахлоқ ва тарбия</option>
        <option value="Дуо ва зикрлар">Дуо ва зикрлар</option>
        <option value="Ал-Ваъй журнали">Ал-Ваъй журнали</option>
        <option value="Ҳизб китоблари">Ҳизб китоблари</option>
      </select>
      <input type="file" id="bookFile" accept="application/pdf" required />
      <button type="submit" class="btn btn-primary" id="uploadBtn"
              data-cyrl="Китоб қўшиш" data-latn="Kitob qo'shish">
        <i class="fas fa-upload"></i> Китоб қўшиш
      </button>

      <div id="progressWrap" hidden>
        <div id="progressBar">0%</div>
      </div>
    </form>
  </section>

  <!-- PDF Modal -->
  <div id="pdfModal" class="modal" hidden>
    <div class="modal-content">
      <span class="modal-close" title="Ёпиш">&times;</span>
      <h3 id="pdfQuestion" data-cyrl="PDF билан нима қилмоқчисиз?"
          data-latn="PDF bilan nima qilmoqchisiz?"><i class="fas fa-file-pdf"></i> PDF билан нима қилмоқчисиз?</h3>
      <button id="openPDFBtn" class="btn btn-ghost"
              data-cyrl="Браузерда очиш" data-latn="Brauzerda ochish">
        <i class="fas fa-eye"></i> Браузерда очиш
      </button>
      <button id="downloadPDFBtn" class="btn btn-danger"
              data-cyrl="Юклаб олиш" data-latn="Yuklab olish">
        <i class="fas fa-download"></i> Юклаб олиш
      </button>
      <div id="downloadNotice" hidden>
        <p class="success-text" id="downloadOk"
           data-cyrl="PDF қурилмангизга муваффақиятли юкланди!"
           data-latn="PDF qurilmangizga muvaffaqiyatli yuklandi!">
           <i class="fas fa-check-circle"></i> PDF қурилмангизга муваффақиятли юкланди!</p>
        <a id="openDownloaded" href="" target="_blank" class="btn btn-primary"
           data-cyrl="Юкланган PDF ни очиш" data-latn="Yuklangan PDF ni ochish">
           <i class="fas fa-external-link-alt"></i> Юкланган PDF ни очиш</a>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Premium Кутубхона.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
