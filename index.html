<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kutubxona</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="light">
  <header>
    <h1>Kutubxonaga Xush kelibsiz</h1>
    <p class="subtitle">Sizga kitobni tavsiya qilamiz!</p>
    <div class="header-actions">
      <input type="text" id="searchInput" placeholder="Qaysi kitobni qidiryapsiz?" aria-label="Kitob qidirish"/>
      <button id="toggleTheme" class="btn btn-ghost" aria-label="Mavzuni almashtirish">🌙 Qorong'u</button>
    </div>
  </header>

  <nav id="categories">
    <button class="category-btn btn" data-category="Hadis">📜 Hadis</button>
    <button class="category-btn btn" data-category="Tarix">🏛️ Tarix</button>
    <button class="category-btn btn" data-category="Fiqh">⚖️ Fiqh</button>
  </nav>

  <main>
    <div id="booksContainer" class="grid"></div>
  </main>

  <div class="center">
    <button id="showUploadBtn" class="btn btn-primary">🔑 Admin Rejim</button>
  </div>

  <section id="uploadSection" hidden>
    <h2>📥 Yangi kitob qo‘shish</h2>
    <form id="uploadForm">
      <input type="text" id="bookTitle" placeholder="Kitob nomi" required/>
      <input type="text" id="bookDescription" placeholder="Tavsif" required/>
      <select id="bookCategory" required>
        <option value="">Kategoriya tanlang</option>
        <option value="Hadis">Hadis</option>
        <option value="Tarix">Tarix</option>
        <option value="Fiqh">Fiqh</option>
      </select>
      <input type="file" id="bookFile" accept="application/pdf" required/>
      <button type="submit" class="btn btn-primary">Qo‘shish</button>

      <div id="progressContainer" hidden>
        <div id="progressBar">0%</div>
      </div>
    </form>
  </section>

  <section id="pdfOptions" hidden>
    <h3>📚 PDF bilan nima qilmoqchisiz?</h3>
    <button id="openPDFBtn" class="btn btn-ghost">📖 Brauzerda ochish</button>
    <button id="downloadPDFBtn" class="btn btn-danger">⬇️ Yuklab olish</button>

    <div id="downloadMessage" hidden>
      <p class="success-text">✅ PDF qurilmangizga muvaffaqiyatli yuklandi!</p>
      <a id="openDownloaded" href="" target="_blank" class="open-pdf-link btn btn-primary">📂 Yuklangan PDF ni ochish</a>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Kutubxona</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  </script>

  <script src="script.js"></script>
</body>
</html>
