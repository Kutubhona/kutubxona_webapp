<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Premium Кутубхона</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <meta name="color-scheme" content="light dark">
</head>
<body class="light">
  <!-- Splash -->
  <div id="splash" aria-hidden="true">
    <h1 data-cyrl="Кутубхонага" data-latn="Kutubxonaga">Кутубхонага</h1>
    <p data-cyrl="Хуш келибсиз!" data-latn="Xush kelibsiz!">Хуш келибсиз!</p>
  </div>

  <header>
    <h1 id="welcomeTitle"
        data-cyrl="Кутубхонага хуш келибсиз!"
        data-latn="Kutubxonaga xush kelibsiz!">Кутубхонага хуш келибсиз!</h1>
    <p class="subtitle"
       data-cyrl="Сизга китоб тавсия қиламиз!"
       data-latn="Sizga kitob tavsiya qilamiz!">Сизга китоб тавсия қиламиз!</p>

    <div class="header-actions">
      <input type="text" id="searchInput"
             placeholder="Қайси китобни қидиряпсиз?"
             aria-label="Китоб қидириш"
             data-ph-cyrl="Қайси китобни қидиряпсиз?"
             data-ph-latn="Qaysi kitobni qidiryapsiz?" />

      <button id="toggleTheme" class="btn btn-ghost" aria-label="Қоронғу/Ёруғ режим">
        <i class="fas fa-moon"></i> Қоронғу режим
      </button>

      <button id="toggleLang" class="btn btn-ghost" aria-label="Тилни алмаштириш"
              data-cyrl="Тил: Кирилл" data-latn="Til: Lotin">
        <i class="fas fa-language"></i> Тил: Кирилл
      </button>
    </div>
  </header>

  <!-- Kategoriyalar -->
  <nav class="categories-row" id="categories">
    <button class="category-btn btn" data-category="Қуръони Карим">Қуръони Карим</button>
    <button class="category-btn btn" data-category="Тафсир китоблари">Тафсир китоблари</button>
    <button class="category-btn btn" data-category="Ҳадис китоблари">Ҳадис китоблари</button>
    <button class="category-btn btn" data-category="Фиқҳий китоблар">Фиқҳий китоблар</button>
    <button class="category-btn btn" data-category="Ақида китоблари">Ақида китоблари</button>
    <button class="category-btn btn" data-category="Тарих китоблари">Тарих китоблари</button>
    <button class="category-btn btn" data-category="Сийрат китоблари">Сийрат китоблари</button>
    <button class="category-btn btn" data-category="Саҳобалар ҳаёти">Саҳобалар ҳаёти</button>
    <button class="category-btn btn" data-category="Ахлоқ ва тарбия">Ахлоқ ва тарбия</button>
    <button class="category-btn btn" data-category="Дуо ва зикрлар">Дуо ва зикрлар</button>
    <!-- yangi 2ta -->
    <button class="category-btn btn" data-category="Ал-Ваъй журнали">Ал-Ваъй журнали</button>
    <button class="category-btn btn" data-category="Ҳизб китоблари">Ҳизб китоблари</button>
  </nav>

  <main>
    <div id="booksContainer" class="grid">
      <!-- Kartalar JS orqali keladi. Matnlar til tugmasi bosilganda translit qilinadi. -->
    </div>
  </main>

  <div class="center">
    <!-- Admin Rejim matni o‘zgarmaydi -->
    <button id="adminToggle" class="btn btn-primary no-translate"><i class="fas fa-key"></i> Admin Rejim</button>
  </div>

  <!-- Upload Section (faqat Admin rejimda ko'rinadi) -->
  <section id="uploadSection" hidden>
    <form id="uploadForm" class="card">
      <h3>Китоб қўшиш</h3>
      <input type="text" id="bookTitle" placeholder="Китоб номи" required>
      <textarea id="bookDescription" placeholder="Қисқача тавсиф" required></textarea>
      <select id="bookCategory">
        <option value="Қуръони Карим">Қуръони Карим</option>
        <option value="Тафсир китоблари">Тафсир китоблари</option>
        <option value="Ҳадис китоблари">Ҳадис китоблари</option>
        <option value="Фиқҳий китоблар">Фиқҳий китоблар</option>
        <option value="Ақида китоблари">Ақида китоблари</option>
        <option value="Тарих китоблари">Тарих китоблари</option>
        <option value="Сийрат китоблари">Сийрат китоблари</option>
        <option value="Саҳобалар ҳаёти">Саҳобалар ҳаёти</option>
        <option value="Ахлоқ ва тарбия">Ахлоқ ва тарбия</option>
        <option value="Дуо ва зикрлар">Дуо ва зикрлар</option>
        <option value="Ал-Ваъй журнали">Ал-Ваъй журнали</option>
        <option value="Ҳизб китоблари">Ҳизб китоблари</option>
      </select>
      <input type="file" id="bookFile" accept="application/pdf" required>
      <div id="progressWrap" hidden><div id="progressBar">0%</div></div>
      <button type="submit" class="btn btn-primary"><i class="fas fa-upload"></i> Юклаш</button>
    </form>
  </section>

  <!-- Modal (PDF) -->
  <div id="pdfModal" class="modal" hidden>
    <div class="modal-content">
      <span class="modal-close" title="Ёпиш">&times;</span>
      <h3><i class="fas fa-file-pdf"></i> PDF билан нима қилмоқчисиз?</h3>
      <button id="openPDFBtn" class="btn btn-ghost"><i class="fas fa-eye"></i> Браузерда очиш</button>
      <button id="downloadPDFBtn" class="btn btn-danger"><i class="fas fa-download"></i> Юклаб олиш</button>
      <div id="downloadNotice" hidden>
        <p class="success-text"><i class="fas fa-check-circle"></i> PDF қурилмангизга муваффақиятли юкланди!</p>
        <a id="openDownloaded" href="" target="_blank" class="btn btn-primary"><i class="fas fa-external-link-alt"></i> Юкланган PDF ни очиш</a>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Premium Кутубхона.</p>
  </footer>

  <!-- Firebase SDK va config -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-analytics.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
    import { getStorage } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDuk-PhyFg5j7JkVnvfcYfBKGMoNZtT02s",
      authDomain: "kutubxona-79dd3.firebaseapp.com",
      projectId: "kutubxona-79dd3",
      storageBucket: "kutubxona-79dd3.firebasestorage.app",
      messagingSenderId: "593289819612",
      appId: "1:593289819612:web:89b9a8dd933f945eb78b19",
      measurementId: "G-Z0Z4FWPWP8"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
  </script>

  <script src="script.js"></script>
</body>
</html>
